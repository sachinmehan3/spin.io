<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spin.io</title>
    <meta name="description" content="Spinning tops battle in a steel stadium. Knock them out and take their spin." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bangers&family=Exo+2:ital,wght@0,500;0,700;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
      <symbol id="scribble" viewBox="0 0 300 100" preserveAspectRatio="none">
        <path vector-effect="non-scaling-stroke" d="M 42 62 C 22 24, 236 4, 280 42 C 306 70, 128 100, 38 76 C 4 64, 40 22, 172 18" />
      </symbol>
    </svg>

    <canvas id="game"></canvas>

    <div id="hud" class="hidden">
      <div class="gauges">
        <div class="gauge">
          <span class="gauge-name">spin</span>
          <div class="bar"><div id="spin-fill" class="fill"></div></div>
          <span id="spin-text" class="gauge-value">100</span>
        </div>
        <div class="gauge">
          <span class="gauge-name">dash</span>
          <div class="bar thin"><div id="dash-fill" class="fill dash"></div></div>
          <span id="dash-text" class="gauge-value">ready</span>
        </div>
        <div class="gauge">
          <span class="gauge-name">knockouts</span>
          <span id="ko-count" class="tally-slot"></span>
        </div>
      </div>
      <div class="board">
        <h2>Biggest tops</h2>
        <ol id="board"></ol>
      </div>
      <div id="feed"  aria-live="polite"></div>
      <canvas id="minimap" width="170" height="170" aria-hidden="true"></canvas>
    </div>

    <div class="sound-controls">
      <button id="mute">sound on</button>
      <button id="clash-style" title="Collision sound: heavy (recorded) or classic (metal tink)">clash: heavy</button>
    </div>

    <section id="spawn" class="overlay">
      <div class="frame">
        <div class="slate">
          <h1>Spin.io</h1>
          <p class="tagline">Knock them out of the ring and take their spin.</p>

          <label class="name-line">
            <span>Your name</span>
            <input id="name" maxlength="14" placeholder="write it here" autocomplete="off" spellcheck="false" />
          </label>

          <fieldset class="picker">
            <legend>Pick a top</legend>
            <div id="types" class="types" role="radiogroup" aria-label="Top type"></div>
          </fieldset>

          <button id="play" class="rip">
            Let it rip!
            <svg class="scribble" aria-hidden="true"><use href="#scribble" width="100%" height="100%" /></svg>
          </button>

          <p id="best" class="note"></p>
          <p class="note">Steer with your mouse. Click or press space to dash. M mutes the sound.</p>
        </div>
        <div class="tray">
          <span class="tray-label">Colour</span>
          <div id="swatches" class="sticks" role="radiogroup" aria-label="Colour"></div>
        </div>
      </div>
    </section>

    <section id="results" class="overlay hidden">
      <div class="frame">
        <div class="slate">
          <h2 id="cause-detail" class="verdict"></h2>
          <dl class="stats">
            <div><dt>Knockouts</dt><dd id="r-kos"></dd></div>
            <div><dt>Biggest you got</dt><dd id="r-peak"></dd></div>
            <div><dt>Lasted</dt><dd id="r-time"></dd></div>
          </dl>
          <p id="new-best" class="new-best hidden">New personal best!</p>
          <button id="again" class="rip">
            Play again
            <svg class="scribble" aria-hidden="true"><use href="#scribble" width="100%" height="100%" /></svg>
          </button>
          <button id="change" class="link">Pick a different top</button>
        </div>
        <div class="tray"></div>
      </div>
    </section>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
